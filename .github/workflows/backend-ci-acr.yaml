name: Backend CI ACR

on:
  push:
    tags:
      - "v*"

env:
  # 你的 ACR 实例域名（不带协议）
  ACR_REGISTRY: crpi-ywue2o6mpn8qaq0l.cn-hangzhou.personal.cr.aliyuncs.com

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_backend_base:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend Base Image
        uses: docker/build-push-action@v5
        with:
          context: ./src/backend/
          file: ./src/backend/base.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.ACR_REGISTRY }}/tangshu/bisheng-backend:base.v3
          cache-from: type=registry,ref=${{ env.ACR_REGISTRY }}/tangshu/bisheng-backend:base.v3
          cache-to: type=inline

  build_backend:
    runs-on: ubuntu-latest
    needs: build_backend_base

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./src/backend/
          file: ./src/backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE_IMAGE=${{ env.ACR_REGISTRY }}/tangshu/bisheng-backend:base.v3
          tags: |
            ${{ env.ACR_REGISTRY }}/tangshu/bisheng-backend:latest
            ${{ env.ACR_REGISTRY }}/tangshu/bisheng-backend:${{ steps.get_version.outputs.VERSION }}
